name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.23', 'stable']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test ./...

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: gocsvj
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: csvj-org/conformance
          ref: master
          path: conformance
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: 'stable'
      - name: Point conformance suite at this PR's gocsvj
        working-directory: conformance
        run: go mod edit -replace github.com/csvj-org/gocsvj=../gocsvj
      - name: Run conformance suite
        working-directory: conformance
        run: go test ./...
